// The look a beat shows: its own, else the scene's (or the ending's).
const baseLook = (S, X) => {
  const o = S.scene != null ? X.scenes.get(S.scene) : S.ending != null ? X.endings[S.ending] : null;
  return (o && o.look) || "";
};
// Signal a look (ink = unwitnessed, bloom = witnessed) when it differs from the one last shown.
function showLook(S, look) {
  if (!look || S.lookShown === look) return;
  S.lookShown = look;
  S.cues.push(look === "ink" ? { type: "ink" } : { type: "bloom" });
}
// A stop with no beat shown since the scene was entered still signals the scene's look.
const settleLook = S => { if (!S.lookShown) showLook(S, S.look); };

// Visible options of a group, each with its lock state. `when` false hides; `lock` false greys.
function optionStates(S, group) {
  const out = [];
  for (const o of group.options || []) {
    if (o.when && !cond(S, o.when)) continue;
    out.push({ o, locked: !!(o.lock && !cond(S, o.lock)) });
  }
  return out;
}

function enterScene(S, X, id, env, first) {
  const sc = X.scenes.get(id);
  S.scene = id; S.ending = null; S.set = sc.set || ""; S.look = sc.look || ""; S.lookShown = ""; S.opened = false; S.rollRes = null;
  S.q = (sc.beats || []).map((_, i) => `b ${id}:${i}`).concat((sc.choices || []).map(g => `g ${id}:${g.key}`));
  if (!first) S.cues.push({ type: "turn", dir: 1 });
  if (env.scene) env.scene(id);
}
function deadEnd(S, env) {
  S.scene = null; S.ending = null; S.q = []; S.node = "ending"; S.cur = "f "; S.revealed = true;
  S.cues.push({ type: "close" });
  if (env.final) env.final(null);
}
function enterEnding(S, X, id, env) {
  const e = X.endings[id];
  if (!e) return deadEnd(S, env);
  S.scene = null; S.ending = id; S.set = e.set || ""; S.look = e.look || ""; S.lookShown = ""; S.opened = false; S.rollRes = null;
  S.q = (e.beats || []).map((_, i) => `b ending:${id}:${i}`).concat([`f ${id}`]);
  S.cues.push({ type: "turn", dir: 1 });
  if (env.ending) env.ending(id);
}
function enterTarget(S, X, id, env) {
  if (X.scenes.has(id)) enterScene(S, X, id, env, false);
  else if (has(X.endings, id)) enterEnding(S, X, id, env);
  else deadEnd(S, env);
}
// The queue ran dry: leave the scene by ending, route or next. Returns true if the machine moved on.
function leave(S, X, env) {
  const sc = S.scene ? X.scenes.get(S.scene) : null;
  if (!sc) { deadEnd(S, env); return false; }
  if (sc.ending) { enterEnding(S, X, sc.ending, env); return true; }
  if (Array.isArray(sc.route)) {
    for (const r of sc.route) if (isObj(r) && (!r.when || cond(S, r.when))) { enterTarget(S, X, r.to, env); return true; }
    deadEnd(S, env); return false;
  }
  if (sc.next) { enterTarget(S, X, sc.next, env); return true; }
  deadEnd(S, env);
  return false;
}

// Run the queue until the machine needs the player.
function settle(S, X, env) {
  for (let guard = 0; ; guard++) {
    if (guard > 10000) throw new Error("Stage: the story loops without showing a beat or a choice");
    if (!S.q.length) {
      if (S.node === "ending") return;
      if (!leave(S, X, env)) return;
      continue;
    }
    const head = S.q.shift();
    const [k, ref] = split(head);
    if (k === "b") {
      const b = X.beats.get(ref);
      if (!b || (b.when && !cond(S, b.when))) continue;
      if (b.set && b.set !== S.set) { S.set = b.set; S.opened = false; S.cues.push({ type: "shift" }); }
      S.node = "beat"; S.cur = head; S.revealed = !b.reveal;
      S.look = b.look || baseLook(S, X); // a beat's look overrides the scene's for that beat
      if (!b.reveal) showLook(S, S.look); // a hidden beat signals when it is revealed
      if (env.beat) env.beat(ref, b);
      return;
    }
    if (k === "g") {
      const { scene, group } = X.groups.get(ref);
      const st = optionStates(S, group);
      for (const x of st) if (x.locked && env.locked) env.locked(`${scene.id}:${group.key}.${x.o.key}`);
      const pay = group.gate === "fate" && group.cost;
      const afford = !pay || S.meters[group.cost.meter] >= group.cost.n;
      if (!afford || !st.some(x => !x.locked)) continue; // never block the game
      S.node = "choice"; S.cur = head; settleLook(S);
      if (env.group) env.group(ref, group);
      return;
    }
    if (k === "i") { S.node = "input"; S.cur = head; settleLook(S); return; }
    if (k === "r") { S.node = "roll"; S.cur = head; S.rollRes = null; settleLook(S); return; }
    if (k === "t") { enterTarget(S, X, ref, env); continue; }
    if (k === "f") {
      S.node = "ending"; S.cur = head; S.revealed = true;
      settleLook(S);
      S.cues.push({ type: "close" });
      if (env.final) env.final(ref);
      return;
    }
  }
}

// The player picks an option. Returns a refusal string or null.
function pick(S, X, key, env) {
  const { scene, group } = X.groups.get(split(S.cur)[1]);
  const st = optionStates(S, group).find(x => x.o.key === key);
  if (!st) return `No option "${key}" here`;
  if (st.locked) return "That option is locked";
  const pay = group.gate === "fate" && group.cost;
  if (pay && S.meters[group.cost.meter] < group.cost.n) return "Not enough to pay";
  const o = st.o, oref = `${scene.id}:${group.key}.${o.key}`;
  if (group.gate === "exec" || group.gate === "fate") S.cues.push({ type: "seal" });
  if (pay) { S.cues.push({ type: "tear" }); applyEffects(S, X, [{ meter: group.cost.meter, add: -group.cost.n }]); }
  if (env.pick) env.pick(oref, group, o);
  applyEffects(S, X, o.effects);
  const q = [];
  if (o.input) q.push(`i ${oref}`);
  (o.then || []).forEach((_, i) => q.push(`b ${oref}:then:${i}`));
  if (o.roll) q.push(`r ${oref}`);
  if (o.to) { q.push(`t ${o.to}`); S.q = q; } else S.q = q.concat(S.q);
  S.node = null;
  settle(S, X, env);
  return null;
}

const addValue = (S, X, add) => {
  if (typeof add === "number") return add;
  if (typeof add !== "string") return 0;
  if (X.meters.has(add)) return S.meters[add];
  return Number(S.fields[add]) || 0;
};

// Apply a decided roll: record it, apply the result's effects, queue its beats.
function applyRoll(S, X, oref, spec, info) {
  const label = ((spec.results || {})[info.used] || {}).label || null;
  S.rollRes = { ...info, under: !!spec.under, table: !!spec.table, label };
  S.cues.push({ type: "roll", dice: spec.dice, faces: info.faces, total: info.total, add: info.add, vs: spec.vs, under: !!spec.under, table: !!spec.table, label, result: info.result, used: info.used });
  const res = (spec.results && spec.results[info.used]) || {};
  applyEffects(S, X, res.effects);
  S.q = (res.then || []).map((_, i) => `b ${oref}:roll.${info.used}:${i}`).concat(S.q);
}
// The faces' lowest and highest totals for a dice spec.
const diceRange = d => (d.f === "F" ? [-d.n, d.n] : [d.n, d.n * d.f]);
// The result tiers (after the tie and style fallbacks) that dice d can reach with this modifier, in table order.
function reachableTiers(resolver, spec, add) {
  const d = parseDice(spec.dice) || { n: 2, f: 6 };
  const [lo, hi] = diceRange(d), got = new Set();
  for (let t = lo + add; t <= hi + add; t++) got.add(used(spec, nominalOf(resolver, spec, t)));
  return (spec.table ? Object.keys(spec.results || {}) : ["fail", "tie", "success", "style"]).filter(k => got.has(k));
}
// Roll the dice for the pending roll node. `forced` is a result key to steer toward (replay), or null.
// A forced result draws its faces within that tier: by rejection first, then by building faces for a seeded total.
function resolveRoll(S, X, forced) {
  const oref = split(S.cur)[1];
  const spec = X.options.get(oref).option.roll;
  const d = parseDice(spec.dice) || { n: 2, f: 6 };
  const add = addValue(S, X, spec.add);
  let faces = rollFaces(S, d);
  let nom = nominalOf(X.resolver, spec, sum(faces) + add), u = used(spec, nom);
  if (forced && u !== forced) {
    for (let t = 0; t < 200 && u !== forced; t++) {
      faces = rollFaces(S, d);
      nom = nominalOf(X.resolver, spec, sum(faces) + add); u = used(spec, nom);
    }
    if (u !== forced) {
      const [lo, hi] = diceRange(d);
      const totals = [];
      for (let t = lo; t <= hi; t++) if (used(spec, nominalOf(X.resolver, spec, t + add)) === forced) totals.push(t);
      const dlo = d.f === "F" ? -1 : 1, dhi = d.f === "F" ? 1 : d.f;
      if (totals.length) {
        let extra = totals[Math.floor(rand(S) * totals.length)] - d.n * dlo;
        faces = Array.from({ length: d.n }, () => dlo);
        while (extra > 0) { const i = Math.floor(rand(S) * d.n); if (faces[i] < dhi) { faces[i]++; extra--; } }
        nom = nominalOf(X.resolver, spec, sum(faces) + add); u = used(spec, nom);
      } else { // the dice cannot give it: fake the faces, keep the asked-for result
        faces = Array.from({ length: d.n }, () => (forced === "fail" || forced === "tie" ? dlo : dhi));
        nom = u = forced;
      }
    }
  }
  applyRoll(S, X, oref, spec, { dice: spec.dice, faces, add, total: sum(faces) + add, vs: spec.vs, result: nom, used: u });
}

// ---- the game ----
function create(pack, opts) {
  opts = opts || {};
  const X = index(pack);
  const forceQ = Array.isArray(opts.force) ? opts.force.slice() : [];
  let S = null, hist = [], floor = 0;
  const meta = { met: [], found: [] };
  const addTo = (list, id) => { if (id != null && !list.includes(id)) list.push(id); };
  const meet = b => { for (const n of b.notes || []) addTo(meta.met, n); if (b.comment) addTo(meta.met, b.comment); };
  const env = {
    beat: (ref, b) => { if (!b.reveal) meet(b); },
    group: (ref, g) => meet(g),
    final: id => { if (id != null) addTo(meta.found, id); },
  };
  const hidden = () => S.node === "beat" && !S.revealed;

  function sane(st) {
    try {
      if (!st || typeof st !== "object" || !Array.isArray(st.q) || !st.flags || !st.fields || !st.meters || !st.tallies) return false;
      if (!["beat", "choice", "input", "roll", "ending"].includes(st.node)) return false;
      const ok = d => {
        const [k, ref] = split(String(d));
        if (k === "b") return X.beats.has(ref);
        if (k === "g") return X.groups.has(ref);
        if (k === "i" || k === "r") return X.options.has(ref);
        if (k === "t") return X.scenes.has(ref) || has(X.endings, ref);
        return k === "f";
      };
      if (st.scene != null && !X.scenes.has(st.scene)) return false;
      if (st.ending != null && !has(X.endings, st.ending)) return false;
      return ok(st.cur) && st.q.every(ok);
    } catch (e) { return false; }
  }
  function load(text) {
    try {
      const d = JSON.parse(text);
      if (!d || d.v !== SAVE_VERSION || d.pack !== pack.id || !Array.isArray(d.hist) || !d.hist.length) return false;
      if (!d.hist.every(sane)) return false;
      hist = d.hist.map(clone);
      floor = Math.max(0, Math.min(hist.length - 1, d.floor | 0));
      S = { ...clone(hist[hist.length - 1]), cues: [] };
      meta.met = (d.met || []).filter(x => typeof x === "string");
      meta.found = (d.found || []).filter(x => typeof x === "string");
      return true;
    } catch (e) { return false; }
  }

  const seed = opts.seed == null ? 1 : Math.floor(Number(opts.seed)) >>> 0;
  if (!(opts.save && load(opts.save))) {
    S = newState(X, seed);
    enterScene(S, X, pack.start, env, true);
    settle(S, X, env);
    afterSettle();
    hist = [snap(S)];
    floor = 0;
  }

  // A roll node is resolved the moment it is reached; the dice are the engine's.
  function afterSettle() {
    if (S.node === "roll" && !S.rollRes) resolveRoll(S, X, forceQ.length ? forceQ.shift() : null);
  }
  function commit(seal) {
    hist.push(snap(S));
    if (seal) floor = hist.length - 1;
    if (hist.length > MAX_HIST) { hist.shift(); floor = Math.max(0, floor - 1); }
  }
  const idOf = st => (st.scene != null ? st.scene : st.ending);

  function view() {
    const sc = S.scene != null ? X.scenes.get(S.scene) : null;
    const en = S.ending != null ? X.endings[S.ending] : null;
    const scene = sc ? { id: sc.id, title: sc.title, place: sc.place || "", look: S.look, set: S.set, ending: false }
      : en ? { id: S.ending, title: en.title, place: "", look: S.look, set: S.set, ending: true } : null;
    const [k, ref] = S.cur ? split(S.cur) : ["", ""];
    let beat = null, group = null, options = [], input = null, roll = null, ending = null;
    if (S.node === "beat") {
      const b = X.beats.get(ref), hid = hidden();
      beat = {
        ref, text: hid ? "" : b.text, kicker: b.kicker || null, speaker: b.speaker || null, set: S.set, look: S.look,
        notes: hid ? [] : (b.notes || []).slice(), comment: hid ? null : b.comment || null,
        reveal: !!b.reveal, revealed: !hid, hidden: hid, screen: hid ? null : b.screen ? b.screen.slice() : null,
      };
    } else if (S.node === "choice") {
      const g = X.groups.get(ref).group;
      group = { key: g.key, ask: g.ask, gate: g.gate, cost: g.cost ? { ...g.cost } : null, notes: (g.notes || []).slice(), comment: g.comment || null };
      options = optionStates(S, g).map(({ o, locked }) => ({ key: o.key, label: o.label, sub: o.sub || null, locked, hint: locked ? o.hint || null : null, gate: g.gate }));
    } else if (S.node === "input") {
      const o = X.options.get(ref).option;
      input = { field: o.input.field, prompt: o.input.prompt, max: o.input.max || 140, option: o.key };
    } else if (S.node === "roll") {
      roll = S.rollRes ? { ...S.rollRes, faces: S.rollRes.faces.slice() } : null;
    } else if (S.node === "ending") {
      ending = { id: S.ending, title: en ? en.title : "The end", look: S.look, set: S.set };
    }
    return {
      node: S.node, scene, beat, group, options, input, roll, ending,
      shown: S.lookShown || null, // the look the stage shows now (the last ink or bloom), so a kit can restore it
      opened: !!S.opened,         // a secret in the current set has been revealed (its flap or redaction stays open)
      meters: { ...S.meters }, fields: { ...S.fields }, flags: { ...S.flags }, tallies: clone(S.tallies),
      cues: orderCues(S.cues), canBack: hist.length - 1 > floor, seed: S.seed, met: meta.met.slice(), found: meta.found.slice(),
    };
  }
  const refused = (msg) => { const v = view(); v.cues = []; v.refused = msg; return v; };

  const game = {
    view,
    next() {
      if (S.node === "beat" && hidden()) return game.reveal();
      if (S.node !== "beat" && S.node !== "roll") { S.cues = []; return view(); }
      S.cues = [];
      S.node = null;
      settle(S, X, env); afterSettle(); commit(false);
      return view();
    },
    choose(key) {
      S.cues = [];
      if (S.node !== "choice") return refused("There is no choice to make");
      const gate = X.groups.get(split(S.cur)[1]).group.gate;
      const before = snap(S);
      const why = pick(S, X, key, env);
      if (why) { S = { ...before, cues: [] }; return refused(why); }
      afterSettle();
      commit(gate === "exec" || gate === "fate");
      return view();
    },
    reveal() {
      S.cues = [];
      if (!hidden()) return view();
      S.revealed = true; S.opened = true; // a secret in this set is open until the set changes
      S.lookShown = "ink"; // a revealed beat always inks, and the ink holds until a beat of another look
      S.cues.push({ type: "ink" });
      meet(X.beats.get(split(S.cur)[1]));
      hist[hist.length - 1] = snap(S);
      return view();
    },
    input(text) {
      S.cues = [];
      if (S.node !== "input") return refused("There is nothing to type here");
      const o = X.options.get(split(S.cur)[1]).option;
      S.fields[o.input.field] = String(text == null ? "" : text).replace(/\s+/g, " ").trim().slice(0, o.input.max || 140);
      S.node = null;
      settle(S, X, env); afterSettle(); commit(false);
      return view();
    },
    back() {
      const old = S;
      if (!(hist.length - 1 > floor)) { S.cues = []; return view(); }
      hist.pop();
      S = { ...clone(hist[hist.length - 1]), cues: [] };
      if (idOf(old) !== idOf(S)) S.cues.push({ type: "turn", dir: -1 });
      else if (old.set !== S.set) S.cues.push({ type: "shift" });
      return view();
    },
    save() {
      const drop = Math.max(0, hist.length - SAVE_HIST);
      return JSON.stringify({ v: SAVE_VERSION, pack: pack.id, seed: S.seed, floor: Math.max(0, floor - drop), hist: hist.slice(drop), met: meta.met, found: meta.found });
    },
  };
  return game;
}

// Replay a route from Stage.simulate: a route object {ending, count, steps} or its steps.
// A step is { opt: "group.option" } (with result: "<tier>" when the pick rolls) or { input: "text" }.
// A step's result forces that roll tier. `upTo` stops at the choice after that many picks.
function replay(pack, route, opts) {
  opts = opts || {};
  const steps = Array.isArray(route) ? route : route && Array.isArray(route.steps) ? route.steps : null;
  if (!steps) throw new Error("replay: a route is a list of steps, or an object with steps");
  steps.forEach((x, i) => {
    if (!isObj(x) || !(typeof x.opt === "string" && x.opt.includes(".") || has(x, "input"))) throw new Error(`replay: step ${i} must be { opt: "group.option" } or { input }, not ${JSON.stringify(x)}`);
  });
  const picks = steps.filter(x => has(x, "opt"));
  const forces = picks.filter(x => x.result != null).map(x => x.result);
  const typed = steps.filter(x => has(x, "input")).map(x => String(x.input));
  const g = create(pack, { seed: opts.seed, force: forces });
  let pi = 0, ti = 0;
  for (let guard = 0; guard < 100000; guard++) {
    const v = g.view();
    if (v.node === "ending") break;
    if (v.node === "choice") {
      if (pi >= picks.length || (opts.upTo != null && pi >= opts.upTo)) break;
      const dot = picks[pi].opt.indexOf(".");
      const gk = picks[pi].opt.slice(0, dot), ok = picks[pi].opt.slice(dot + 1);
      if (v.group.key !== gk) throw new Error(`replay: expected group "${gk}" but the game asks "${v.group.key}"`);
      pi++;
      const r = g.choose(ok);
      if (r.refused) throw new Error(`replay: ${r.refused}`);
    } else if (v.node === "input") g.input(ti < typed.length ? typed[ti++] : "(typed)");
    else g.next();
  }
  return g;
}

// ---- simulate (SPEC section 3, Simulation) ----
function walkConds(pack, fn) {
  const script = pack.script || {};
  const beats = bs => { for (const b of bs || []) if (b.when) fn(b.when); };
  for (const sc of script.scenes || []) {
    beats(sc.beats);
    for (const r of sc.route || []) if (r.when) fn(r.when);
    for (const g of sc.choices || []) for (const o of g.options || []) {
      if (o.when) fn(o.when);
      if (o.lock) fn(o.lock);
      beats(o.then);
      for (const res of Object.values((o.roll && o.roll.results) || {})) beats(res.then);
    }
  }
  for (const e of Object.values(script.endings || {})) beats(e.beats);
}
function collectReads(pack) {
  const reads = { flags: new Set(), fields: new Set(), meters: new Set(), tallies: new Set() };
  const go = c => {
    if (!isObj(c)) return;
    if (has(c, "flag")) reads.flags.add(c.flag);
    else if (has(c, "field")) reads.fields.add(c.field);
    else if (has(c, "meter")) reads.meters.add(c.meter);
    else if (has(c, "tally")) reads.tallies.add(c.tally);
    else if (has(c, "all")) (c.all || []).forEach(go);
    else if (has(c, "any")) (c.any || []).forEach(go);
    else if (has(c, "not")) go(c.not);
  };
  walkConds(pack, go);
  // A group's cost and a roll's add are read too: they decide what can be afforded and which tiers the dice reach.
  const meterIds = new Set(list(pack.meters).map(m => m && m.id));
  for (const sc of (pack.script && pack.script.scenes) || []) for (const g of sc.choices || []) {
    if (g.cost && g.cost.meter) reads.meters.add(g.cost.meter);
    for (const o of g.options || []) {
      const a = o.roll && o.roll.add;
      if (typeof a === "string") (meterIds.has(a) ? reads.meters : reads.fields).add(a);
    }
  }
  return { flags: [...reads.flags].sort(), fields: [...reads.fields].sort(), meters: [...reads.meters].sort(), tallies: [...reads.tallies].sort() };
}

function simulate(pack) {
  const X = index(pack);
  if (!X.scenes.has(pack.start)) throw new Error(`Stage.simulate: start scene "${pack.start}" does not exist`);
  const reads = collectReads(pack);
  const seen = { scenes: new Set(), beats: new Set(), options: new Set(), endings: new Set(), notes: new Set(), locked: new Set() };
  const env = {
    scene: id => seen.scenes.add(id),
    beat: (ref, b) => { seen.beats.add(ref); for (const n of b.notes || []) seen.notes.add(n); if (b.comment) seen.notes.add(b.comment); },
    group: (ref, g) => { for (const n of g.notes || []) seen.notes.add(n); if (g.comment) seen.notes.add(g.comment); },
    pick: ref => seen.options.add(ref),
    locked: ref => seen.locked.add(ref),
    ending: id => seen.endings.add(id),
  };
  // The state key: where we are, plus only the values some condition reads.
  const keyOf = S => {
    let k = `${S.scene || ""}|${S.ending || ""}|${S.node}|${S.cur}|${S.q.join(",")}|`;
    for (const f of reads.flags) k += S.flags[f] ? "1" : "0";
    k += "|";
    for (const f of reads.fields) k += `${S.fields[f]}\u0001`;
    k += "|";
    for (const m of reads.meters) k += `${S.meters[m]},`;
    k += "|";
    for (const t of reads.tallies) { const tt = S.tallies[t] || {}; k += `${Object.keys(tt).sort().map(v => `${v}=${tt[v]}`).join(";")}/`; }
    return k;
  };
  const recs = new Map();
  const mk = S => {
    const key = keyOf(S);
    let r = recs.get(key);
    if (!r) {
      if (recs.size >= MAX_STATES) throw new Error("Stage.simulate: too many states; the story reads too much state to walk");
      r = { key, S, edges: null, color: 0, ways: 0, terminal: false, ending: null, parent: null };
      recs.set(key, r);
    }
    return r;
  };
  const expand = r => {
    const S = r.S;
    r.S = null;
    const edges = [];
    const go = (S2, label) => { settle(S2, X, env); edges.push({ to: mk(S2), label, dead: false }); };
    if (S.node === "ending") { r.terminal = true; r.ending = S.ending == null ? "(dead end)" : S.ending; return edges; }
    if (S.node === "beat" || S.node === "roll" && S.rollRes) { const S2 = cloneS(S); S2.node = null; go(S2, null); }
    else if (S.node === "choice") {
      const { scene, group } = X.groups.get(split(S.cur)[1]);
      for (const { o, locked } of optionStates(S, group)) {
        if (locked) continue;
        const S2 = cloneS(S);
        const why = pick(S2, X, o.key, env);
        if (why) throw new Error(`Stage.simulate: ${scene.id}:${group.key}.${o.key}: ${why}`);
        edges.push({ to: mk(S2), label: { opt: `${group.key}.${o.key}` }, dead: false });
      }
    } else if (S.node === "input") {
      const S2 = cloneS(S);
      const o = X.options.get(split(S.cur)[1]).option;
      S2.fields[o.input.field] = "(typed)";
      S2.node = null;
      go(S2, { input: "(typed)" });
    } else if (S.node === "roll") {
      const oref = split(S.cur)[1];
      const spec = X.options.get(oref).option.roll;
      const add = addValue(S, X, spec.add);
      for (const key of reachableTiers(X.resolver, spec, add)) { // only tiers the dice can reach from this modifier
        const S2 = cloneS(S);
        applyRoll(S2, X, oref, spec, { dice: spec.dice, faces: [], add, total: 0, vs: spec.vs, result: key, used: key });
        S2.node = null;
        go(S2, { result: key });
      }
    }
    return edges;
  };

  const S0 = newState(X, 1);
  enterScene(S0, X, pack.start, env, true);
  settle(S0, X, env);
  const start = mk(S0);
  const post = [];
  let cycles = 0;
  start.color = 1; start.edges = expand(start);
  const stack = [{ r: start, i: 0 }];
  while (stack.length) {
    const top = stack[stack.length - 1], r = top.r;
    if (top.i < r.edges.length) {
      const e = r.edges[top.i++], c = e.to;
      if (c.color === 1) { e.dead = true; cycles++; continue; }
      if (c.color === 0) { c.color = 1; c.edges = expand(c); stack.push({ r: c, i: 0 }); }
    } else { r.color = 2; post.push(r); stack.pop(); }
  }
  // Count paths forward in topological order (reverse post-order).
  start.ways = 1;
  for (let i = post.length - 1; i >= 0; i--) {
    const r = post[i];
    for (const e of r.edges) if (!e.dead) e.to.ways += r.ways;
  }
  const endings = {};
  for (const id of Object.keys(X.endings)) endings[id] = 0;
  let paths = 0;
  for (const r of post) if (r.terminal) { endings[r.ending] = (endings[r.ending] || 0) + r.ways; paths += r.ways; }
  // One shortest route to each terminal state (breadth first).
  const fifo = [start];
  start.parent = false;
  for (let h = 0; h < fifo.length; h++) {
    const r = fifo[h];
    for (const e of r.edges) if (!e.dead && e.to.parent === null) { e.to.parent = { r, label: e.label }; fifo.push(e.to); }
  }
  const routes = [];
  for (const r of post.slice().reverse()) {
    if (!r.terminal) continue;
    const labels = [];
    for (let c = r; c.parent; c = c.parent.r) if (c.parent.label) labels.push(c.parent.label);
    const steps = [];
    let last = null; // the pick a roll belongs to
    for (const l of labels.reverse()) {
      if (l.opt) steps.push(last = { opt: l.opt });
      else if (l.input) steps.push({ input: l.input });
      else if (l.result && last) last.result = l.result;
    }
    routes.push({ ending: r.ending, count: r.ways, steps });
  }

  // What was never reached.
  const by = { scenes: [], beats: [], options: [], endings: [], notes: [] };
  for (const id of X.scenes.keys()) if (!seen.scenes.has(id)) by.scenes.push(id);
  for (const ref of X.beats.keys()) if (!seen.beats.has(ref)) by.beats.push(ref);
  for (const ref of X.options.keys()) if (!seen.options.has(ref)) by.options.push(ref);
  for (const id of Object.keys(X.endings)) if (!seen.endings.has(id)) by.endings.push(id);
  for (const id of Object.keys(pack.notes || {})) if (!seen.notes.has(id)) by.notes.push(id);
  const unreachable = [...by.scenes, ...by.beats, ...by.options, ...by.endings.map(id => `ending:${id}`), ...by.notes.map(id => `note:${id}`)];
  return { paths, endings, routes, unreachable, unreachableBy: by, locked: [...seen.locked].sort(), states: recs.size, cycles };
}

// ---- validate (SPEC section 2) ----
const ID = /^[A-Za-z0-9_-]+$/;
const KINDS = ["rule", "dm", "lore", "handler", "algorithm", "guide"];
const KITS = { paper: ["spread", "vfold", "parallel", "tunnel", "flap", "pulltab", "volvelle", "ticket", "plate"], feed: ["frame", "track", "scan", "log", "redact", "plate"] };
const words = s => String(s).trim().split(/\s+/).filter(Boolean).length;

// check(pack) -> { errors, warnings }. A speaker missing from cast.json is a warning while the pack has no
// cast.json (a script can be finished before its cast art) and an error once it has one.
function check(pack) {
  const errors = [], warnings = [];
  const err = (where, msg) => errors.push(`${where}: ${msg}`);
  const done = () => ({ errors, warnings });
  if (!isObj(pack)) { errors.push("pack: not an object"); return done(); }
  const str = v => typeof v === "string" && v.trim() !== "";
  const num = v => typeof v === "number" && Number.isFinite(v);

  // pack.json
  if (!str(pack.id) || !/^[a-z0-9-]+$/.test(pack.id)) err("pack.json", `id must be lower-kebab-case, not ${JSON.stringify(pack.id)}`);
  if (!str(pack.title)) err("pack.json", "title is missing");
  if (!["paper", "feed"].includes(pack.kit)) err("pack.json", `kit must be "paper" or "feed", not ${JSON.stringify(pack.kit)}`);
  if (!["ose", "fate4df"].includes(pack.resolver)) err("pack.json", `resolver must be "ose" or "fate4df", not ${JSON.stringify(pack.resolver)}`);
  if (!str(pack.storageKey) || !/^(fort-stage|htll)\.[a-z0-9.-]+$/.test(pack.storageKey)) err("pack.json", `storageKey must start with "fort-stage." or "htll.", not ${JSON.stringify(pack.storageKey)}`);
  const meterIds = new Set(), badMeters = new Set(), fieldIds = new Set(), tallyVals = new Map();
  if (!Array.isArray(pack.meters)) err("pack.json", "meters must be a list (it may be empty)");
  for (const m of list(pack.meters)) {
    const w = `pack.json meter ${m && m.id}`;
    if (!isObj(m) || !str(m.id) || !ID.test(m.id)) { err("pack.json", `a meter has a bad id: ${JSON.stringify(m)}`); continue; }
    if (meterIds.has(m.id)) err(w, "duplicate id");
    meterIds.add(m.id);
    if (!str(m.label)) err(w, "label is missing");
    if (!num(m.min) || !num(m.max) || m.min > m.max) err(w, "min and max must be numbers with min <= max");
    else if (!num(m.start) || m.start < m.min || m.start > m.max) err(w, "start must be a number between min and max");
    if (m.bad != null && typeof m.bad !== "boolean") err(w, "bad must be true or false");
    if (m.bad === true) badMeters.add(m.id);
  }
  if (!Array.isArray(pack.fields)) err("pack.json", "fields must be a list (it may be empty)");
  for (const f of list(pack.fields)) {
    if (!isObj(f) || !str(f.id) || !ID.test(f.id)) { err("pack.json", `a field has a bad id: ${JSON.stringify(f)}`); continue; }
    if (fieldIds.has(f.id)) err(`pack.json field ${f.id}`, "duplicate id");
    if (meterIds.has(f.id)) err(`pack.json field ${f.id}`, "a field and a meter share an id");
    fieldIds.add(f.id);
    if (!str(f.label)) err(`pack.json field ${f.id}`, "label is missing");
    if (f.side != null && !["front", "back"].includes(f.side)) err(`pack.json field ${f.id}`, `side must be "front" or "back", not ${JSON.stringify(f.side)}`);
    if (f.hidden != null && typeof f.hidden !== "boolean") err(`pack.json field ${f.id}`, "hidden must be true or false");
  }
  // tallies: a map of tally id to its allowed values. Never a list of ids.
  if (pack.tallies != null) {
    if (!isObj(pack.tallies)) err("pack.json", "tallies must be a map of tally id to its list of allowed values, not a list");
    else for (const [id, vals] of Object.entries(pack.tallies)) {
      if (!ID.test(id)) { err("pack.json", `tally id ${JSON.stringify(id)} is not a plain id`); continue; }
      if (!Array.isArray(vals) || !vals.length || !vals.every(v => str(v) && ID.test(v)) || new Set(vals).size !== vals.length) err("pack.json", `tally "${id}" must be a non-empty list of distinct value names`);
      else tallyVals.set(id, new Set(vals));
    }
  }
  const commentKinds = pack.commentary && Array.isArray(pack.commentary.kinds) ? pack.commentary.kinds : null;
  if (pack.commentary != null) {
    if (!isObj(pack.commentary) || !str(pack.commentary.label)) err("pack.json", "commentary.label is missing");
    if (!commentKinds || commentKinds.some(k => !KINDS.includes(k))) err("pack.json", `commentary.kinds must be a list drawn from ${KINDS.join(", ")}`);
  }

  // notes.json
  const notes = isObj(pack.notes) ? pack.notes : null;
  if (!notes) err("notes.json", "is missing or is not an object");
  for (const [id, n] of Object.entries(notes || {})) {
    const w = `notes.json ${id}`;
    if (!isObj(n)) { err(w, "must be an object"); continue; }
    if (!KINDS.includes(n.kind)) err(w, `kind must be one of ${KINDS.join(", ")}`);
    if (!str(n.term)) err(w, "term is missing");
    if (!str(n.text)) err(w, "text is missing");
    else if (words(n.text) > 60) err(w, `text has ${words(n.text)} words; the limit is 60`);
  }

  // cast.json: a person with no x, y and r has no portrait (the kit draws a placeholder); sheet is needed only if someone has a crop
  const people = pack.cast && isObj(pack.cast.people) ? pack.cast.people : null;
  if (pack.cast) {
    if (!isObj(pack.cast)) err("cast.json", "must be an object");
    else {
      if (!people) err("cast.json", "people is missing");
      let crops = 0;
      for (const [id, p] of Object.entries(people || {})) {
        if (!isObj(p) || !str(p.name)) { err(`cast.json ${id}`, "needs a name"); continue; }
        const given = ["x", "y", "r"].filter(k => p[k] != null);
        if (given.length === 3) { if (["x", "y", "r"].every(k => num(p[k]))) crops++; else err(`cast.json ${id}`, "x, y and r must be numbers"); }
        else if (given.length) err(`cast.json ${id}`, "x, y and r go together: give all three for a portrait, none for a placeholder");
      }
      if (crops) {
        if (!str(pack.cast.sheet)) err("cast.json", "sheet is missing (a person has a portrait crop)");
        if (!num(pack.cast.w) || !num(pack.cast.h)) err("cast.json", "w and h must be numbers (a person has a portrait crop)");
      } else {
        if (pack.cast.sheet != null && !str(pack.cast.sheet)) err("cast.json", "sheet must be a path");
        for (const k of ["w", "h"]) if (pack.cast[k] != null && !num(pack.cast[k])) err("cast.json", `${k} must be a number`);
      }
    }
  }

  // sets.json
  const sets = isObj(pack.sets) ? pack.sets : null;
  if (!sets) err("sets.json", "is missing or is not an object");
  for (const [id, s] of Object.entries(sets || {})) {
    const w = `sets.json ${id}`;
    if (!isObj(s)) { err(w, "must be an object"); continue; }
    if (s.kit !== pack.kit) err(w, `kit "${s.kit}" does not match the pack's kit "${pack.kit}"`);
    if (!Array.isArray(s.layers) || !s.layers.length) { err(w, "layers must be a non-empty list"); continue; }
    s.layers.forEach((l, i) => {
      const lw = `${w} layer ${i}`;
      if (!isObj(l)) return err(lw, "must be an object");
      const prims = KITS[pack.kit];
      if (prims && !prims.includes(l.prim)) err(lw, `prim "${l.prim}" is not a ${pack.kit} primitive (${prims.join(", ")})`);
      if (l.tally != null) {
        if (!tallyVals.has(l.tally)) err(lw, `tally "${l.tally}" is not in pack.tallies`);
        else if (!tallyVals.get(l.tally).has(l.value)) err(lw, `a layer bound to tally "${l.tally}" needs a value from ${[...tallyVals.get(l.tally)].join(", ")}, not ${JSON.stringify(l.value)}`);
      }
      for (const k of ["x", "y", "w", "h"]) if (l[k] != null && !(num(l[k]) && l[k] >= 0 && l[k] <= 1)) err(lw, `${k} must be a fraction from 0 to 1`);
    });
  }

  // script.json
  const script = isObj(pack.script) ? pack.script : null;
  if (!script || !Array.isArray(script.scenes) || !script.scenes.length) { err("script.json", "needs a non-empty scenes list"); return done(); }
  const endings = isObj(script.endings) ? script.endings : {};
  if (!isObj(script.endings) || !Object.keys(endings).length) err("script.json", "needs at least one ending");
  const sceneIds = new Set();
  for (const sc of script.scenes) {
    if (!isObj(sc) || !str(sc.id) || !ID.test(sc.id)) { err("script.json", `a scene has a bad id: ${JSON.stringify(sc && sc.id)}`); continue; }
    if (sceneIds.has(sc.id)) err(`scene ${sc.id}`, "duplicate id");
    sceneIds.add(sc.id);
  }
  if (!sceneIds.has(pack.start)) err("pack.json", `start "${pack.start}" is not a scene`);
  const target = id => sceneIds.has(id) || has(endings, id);

  // The card fields an input writes: no condition may read them, because typed text cannot be explored.
  const inputFields = new Set();
  for (const sc of script.scenes) for (const g of (isObj(sc) && Array.isArray(sc.choices) ? sc.choices : [])) for (const o of (isObj(g) && Array.isArray(g.options) ? g.options : [])) {
    if (isObj(o) && isObj(o.input) && str(o.input.field)) inputFields.add(o.input.field);
  }

  const checkCond = (w, c) => {
    if (!isObj(c)) return err(w, "a condition must be an object");
    const ks = ["flag", "field", "meter", "tally", "all", "any", "not"].filter(k => has(c, k));
    if (ks.length !== 1) return err(w, `a condition needs exactly one of flag, field, meter, tally, all, any, not: ${JSON.stringify(c)}`);
    const k = ks[0];
    if (k === "flag") { if (!str(c.flag)) err(w, "flag must be a name"); }
    else if (k === "field") {
      if (!fieldIds.has(c.field)) err(w, `field "${c.field}" is not in pack.fields`);
      else if (inputFields.has(c.field)) err(w, `a condition reads field "${c.field}", which an input writes; typed text cannot be explored`);
      if (!has(c, "is")) err(w, `field condition "${c.field}" needs "is"`);
    } else if (k === "meter") {
      if (!meterIds.has(c.meter)) err(w, `meter "${c.meter}" is not in pack.meters`);
      if (!has(c, "gte") && !has(c, "lte")) err(w, "meter condition needs gte or lte");
      for (const b of ["gte", "lte"]) if (has(c, b) && !num(c[b])) err(w, `${b} must be a number`);
    } else if (k === "tally") {
      const vals = tallyVals.get(c.tally);
      if (!vals) err(w, `tally "${c.tally}" is not in pack.tallies`);
      const top = has(c, "top"), val = has(c, "value");
      if (top === val) err(w, "a tally condition is either { tally, top } or { tally, value, gte|lte }");
      else if (top) { if (vals && !vals.has(c.top)) err(w, `tally "${c.tally}" has no value "${c.top}" (${[...vals].join(", ")})`); }
      else {
        if (vals && !vals.has(c.value)) err(w, `tally "${c.tally}" has no value "${c.value}" (${[...vals].join(", ")})`);
        if (!has(c, "gte") && !has(c, "lte")) err(w, "a tally count condition needs gte or lte");
        for (const b of ["gte", "lte"]) if (has(c, b) && !num(c[b])) err(w, `${b} must be a number`);
      }
    } else if (k === "all" || k === "any") {
      if (!Array.isArray(c[k]) || !c[k].length) err(w, `${k} must be a non-empty list`);
      else c[k].forEach(x => checkCond(w, x));
    } else checkCond(w, c.not);
  };
  const checkEffects = (w, list) => {
    if (list == null) return;
    if (!Array.isArray(list)) return err(w, "effects must be a list");
    for (const e of list) {
      if (!isObj(e)) { err(w, "an effect must be an object"); continue; }
      const ks = ["flag", "set", "meter", "tally"].filter(k => has(e, k));
      if (ks.length !== 1) { err(w, `an effect needs exactly one of flag, set, meter, tally: ${JSON.stringify(e)}`); continue; }
      if (ks[0] === "flag") { if (!str(e.flag)) err(w, "flag must be a name"); }
      else if (ks[0] === "set") {
        if (!isObj(e.set) || !Object.keys(e.set).length) err(w, "set must be an object of field values");
        else for (const f of Object.keys(e.set)) if (!fieldIds.has(f)) err(w, `set: "${f}" is not in pack.fields`);
      } else if (ks[0] === "meter") {
        if (!meterIds.has(e.meter)) err(w, `meter "${e.meter}" is not in pack.meters`);
        if (!num(e.add)) err(w, "meter effect needs a numeric add");
      } else {
        const vals = tallyVals.get(e.tally);
        if (!vals) err(w, `tally "${e.tally}" is not in pack.tallies`);
        if (!str(e.add)) err(w, "tally effect needs add: a value name");
        else if (vals && !vals.has(e.add)) err(w, `tally "${e.tally}" has no value "${e.add}" (${[...vals].join(", ")})`);
      }
    }
  };
  // notes (chips) and comment, on a beat or a choice group
  const checkNotes = (w, x) => {
    if (x.notes != null) {
      if (!Array.isArray(x.notes)) err(w, "notes must be a list of note ids");
      else for (const n of x.notes) if (!(notes && has(notes, n))) err(w, `note "${n}" is not in notes.json`);
    }
    if (x.comment != null) {
      if (!(notes && has(notes, x.comment))) err(w, `comment "${x.comment}" is not in notes.json`);
      else if (!commentKinds) err(w, "has a comment but pack.commentary is missing");
      else if (!isObj(notes[x.comment]) || !commentKinds.includes(notes[x.comment].kind)) err(w, `comment "${x.comment}" is a ${isObj(notes[x.comment]) ? notes[x.comment].kind : "bad"} note; the commentary shows ${commentKinds.join(", ")}`);
    }
  };
  const missingSpeakers = new Map();
  const checkBeats = (w, list) => {
    if (list == null) return;
    if (!Array.isArray(list)) return err(w, "beats must be a list");
    list.forEach((b, i) => {
      const bw = `${w} beat ${i}`;
      if (!isObj(b)) return err(bw, "must be an object");
      if (!str(b.text)) err(bw, "text is missing");
      else if ((b.text.match(/\*/g) || []).length % 2) err(bw, "unbalanced * in text");
      if (b.kicker != null && !str(b.kicker)) err(bw, "kicker must be text");
      if (b.speaker != null) {
        if (!str(b.speaker)) err(bw, "speaker must be a cast id");
        else if (!(people && has(people, b.speaker))) {
          if (pack.cast) err(bw, `speaker "${b.speaker}" is not in cast.json`);
          else missingSpeakers.set(b.speaker, (missingSpeakers.get(b.speaker) || 0) + 1);
        }
      }
      if (b.set != null && sets && !has(sets, b.set)) err(bw, `set "${b.set}" is not in sets.json`);
      if (b.look != null && !["ink", "paint"].includes(b.look)) err(bw, `look must be "ink" or "paint", not ${JSON.stringify(b.look)}`);
      checkNotes(bw, b);
      if (b.reveal != null && typeof b.reveal !== "boolean") err(bw, "reveal must be true or false");
      if (b.screen != null && !(Array.isArray(b.screen) && b.screen.length && b.screen.every(str))) err(bw, "screen must be an array of strings (one line each, at least one)");
      if (b.when != null) checkCond(bw, b.when);
    });
  };

  script.scenes.forEach(sc => {
    if (!isObj(sc) || !sceneIds.has(sc.id)) return;
    const w = `scene ${sc.id}`;
    if (!str(sc.title)) err(w, "title is missing");
    if (!["ink", "paint"].includes(sc.look)) err(w, `look must be "ink" or "paint", not ${JSON.stringify(sc.look)}`);
    if (!str(sc.set)) err(w, "set is missing");
    else if (sets && !has(sets, sc.set)) err(w, `set "${sc.set}" is not in sets.json`);
    checkBeats(w, sc.beats);
    const exits = ["next", "ending", "route"].filter(k => sc[k] != null);
    if (exits.length !== 1) err(w, `needs exactly one of next, ending, route (has ${exits.length ? exits.join(", ") : "none"})`);
    if (sc.next != null && !sceneIds.has(sc.next)) err(w, `next "${sc.next}" is not a scene`);
    if (sc.ending != null && !has(endings, sc.ending)) err(w, `ending "${sc.ending}" is not an ending`);
    if (sc.route != null) {
      if (!Array.isArray(sc.route) || !sc.route.length) err(w, "route must be a non-empty list");
      else sc.route.forEach((r, i) => {
        const rw = `${w} route ${i}`;
        if (!isObj(r) || !target(r.to)) return err(rw, `"to" ${JSON.stringify(r && r.to)} is not a scene or ending`);
        const last = i === sc.route.length - 1;
        if (last && r.when) err(rw, "the last route entry must have no when");
        if (!last) { if (!r.when) err(rw, "only the last route entry may omit when"); else checkCond(rw, r.when); }
      });
    }
    if (sc.choices != null && !Array.isArray(sc.choices)) return err(w, "choices must be a list");
    const gkeys = new Set();
    (sc.choices || []).forEach(g => {
      const gw = `${w} group ${g && g.key}`;
      if (!isObj(g) || !str(g.key) || !ID.test(g.key)) return err(w, `a choice group has a bad key: ${JSON.stringify(g && g.key)}`);

    if (S.look) focusOn = S.look === "paint";
    applyAll(cur, S);
    cur.el.style.transform = closed ? "scaleY(.002)" : "";
    endEl.classList.toggle("k-closed", closed);
    syncTimer();
  },

  cue(c, o) {
    const red = (o && o.reduced) || redNow();
    skipNow = !!(o && o.reduced);
    settle(cur); if (pend) { settle(pend.next); settle(pend.old); }
    const seq = ++cueSeq;
    let p;
    switch (c.type) {
      case "turn": p = cueTurn(o, red, seq); break;
      case "shift": p = cueShift(red); break;
      case "ink": p = cueInk(o, red); break;
      case "bloom": p = cueBloom(red); break;
      case "seal": p = cueSeal(red); break;
      case "roll": p = cueRoll(c, red); break;
      case "cost": case "gain": p = cueMeter(c, red); break;
      case "tear": p = cueTear(red); break;
      case "close": p = cueClose(red); break;
      default: p = Promise.resolve(); // tally: this kit has none
    }
    syncTimer();
    return p;
  },

  // A tap during a cue: every animation jumps to its end, a pending swap completes, and the cue's Promise resolves now.
  finish() {
    stoppedSeq = cueSeq;
    const a = act; act = null;
    for (const x of [...active]) { try { x.finish(); } catch (e) {} }
    active.clear();
    commit();
    if (a) { try { a.end && a.end(); } catch (e) {} a.res(); }
  },

  // The beat's screen lines, drawn in the set's log. The log's own lines come back when the next beat has none.
  // A log with "keep" leaves the last screen up (the ledger holds the ending's lines).
  screen(lines) {
    const K = cur;
    if (!K) return;
    const has = Array.isArray(lines) && lines.length > 0;
    let L = K.logs[0];
    if (has && !L) { // a set with no log gets a plain one for the screen
      const e = buildLog(K, { prim: "log", lines: [], x: 0.02, y: 0.16, w: 0.6 });
      e.style.zIndex = "9"; K.el.appendChild(e); L = K.logs[K.logs.length - 1]; L.auto = true;
    }
    if (!L) return;
    if (has) {
      const key = lines.join("\n");
      if (K.screenOn && K.screenKey === key) return;
      K.screenOn = true; K.screenKey = key;
      renderLog(L, lines.map(t => ({ t })));
      if (L.layer.keep) L.model = lines.map(t => ({ t }));

      else renderLog(L);
    }
  },

  // Ambient: nothing here moves per frame. The drift and the sweep are CSS animations (paused while a cue plays and while the
  // page is hidden, absent under reduced motion and when the feed is closed); the clock counts on its own one-second timer.
  // So tick() only makes sure the timer is right (the shell calls it once on a cue, also when hidden or reduced) and returns
  // false, which lets the shell stop its frame loop.
  tick() {
    syncTimer();
    return false;
  },

  card(scene) {
    const sc = scene || {};
    const set = sc.set && pack && pack.sets && pack.sets[sc.set];
    const f = layersOf(set).find(l => l.prim === "frame");
    const chan = f ? [f.channel, f.view].filter(Boolean).join(" · ") : "";

  },

  destroy() {
    if (ro) { try { ro.disconnect(); } catch (e) {} ro = null; }

// ---------------------------------------------------------------- the cues
// turn: a hard cut. The new set is in place in one frame, soft, with a new channel and time. The boxes lock in (1.12 to 1),
// then the log prints a line at a time. The look cue that follows sets focus (bloom) or leaves it soft (ink).
function cueTurn(o, red, seq) {
  const K = cur;
  if (!K) return Promise.resolve();
  unfollowPlace();
  const p = pend; pend = null;
  if (p && p.old && p.old.el.parentNode) p.old.el.remove();
  K.el.style.opacity = ""; K.el.style.transform = "";
  closed = false; closedFresh = false; locked = false; endEl.classList.remove("k-closed");
  focusOn = false;
  resetClock(K, o && o.scene);
  applyAll(K); restartSweeps(K);
  if (red) return Promise.resolve();
  return track(playTurn(K, seq));
}
async function playTurn(K, seq) {
  await Promise.all(K.tracks.map(T => run(T.box, [{ transform: `scale(${T.scale * 1.12})`, offset: 0 }], tk.state, tk.easeOut)));
  if (dead(seq)) return;
  const L = K.logs[0];
  if (L && !K.screenOn) await Promise.all([...L.el.children].map((ln, i) => run(ln, [{ opacity: 0, offset: 0 }], tk.state, tk.easeOut, { delay: i * tk.step })));
}

// shift: the old layers fade out and the new fade in together. The clock holds; only the channel changes.
function cueShift(red) {
  if (!pend) return Promise.resolve();
  const p = pend; p.next.el.style.opacity = "";
  if (locked || focusOn) applyAll(p.next, p.next.st);
  if (red || !p.old) { commit(); return Promise.resolve(); }
  const a = run(p.next.el, [{ opacity: 0, offset: 0 }], tk.cross, tk.easeOut);
  run(p.old.el, [{ opacity: 1, offset: 0 }, { opacity: 0, offset: 1 }], tk.cross, tk.easeOut);
  p.old.el.style.opacity = "0";
  return track(a, commit);
}

// ink: unwitnessed. The frame goes out of focus and the boxes dim. A reveal also lifts the redaction.
function cueInk(o, red) {
  const K = cur; if (!K) return Promise.resolve();
  const reveal = !!(o && o.beat && o.beat.reveal);
  focusOn = false;
  K.cam.classList.remove("k-in-focus");
  for (const P of K.plates) P.el.classList.remove("in-focus");
  for (const T of K.tracks) T.dim.style.opacity = "0.55";
  const ps = [];
  if (!red) {
    ps.push(run(K.art, [{ opacity: 1, offset: 0 }], tk.ink, tk.easeOut));
    for (const T of K.tracks) ps.push(run(T.dim, [{ opacity: 1, offset: 0 }], tk.ink, tk.easeOut));
    for (const P of K.plates) ps.push(run(P.sharp, [{ opacity: 1, offset: 0 }], tk.ink, tk.easeOut));
  }
  if (reveal) {
    K.st = Object.assign({}, K.st, { revealed: true });
    for (const r of K.redacts) if (r.opens) {
      (r.over ? r.over.name : r.el).classList.add("is-open");
      redactAria(r, true);
      if (!red) ps.push(run(r.bar, [{ opacity: 1, transform: "none", offset: 0 }], tk.ink, tk.easeOut));
    }
    const L = logFor(K, "ink");
    if (L) addEntry(L, K, { t: "REDACTION LIFTED" });
  }
  return track(Promise.all(ps));
}

// bloom: witnessed. A sharp layer fades in over the pre-blurred copy; the box fills and faces come up by opacity. No scale.
function cueBloom(red) {
  const K = cur; if (!K) return Promise.resolve();
  focusOn = true;
  K.cam.classList.add("k-in-focus");
  for (const P of K.plates) P.el.classList.add("in-focus");
  for (const T of K.tracks) T.dim.style.opacity = "";
  if (red) return Promise.resolve();
  const ps = [run(K.art, [{ opacity: 0, offset: 0 }], tk.bloom, tk.easeOut)];
  for (const T of K.tracks) ps.push(run(T.dim, [{ opacity: 0.55, offset: 0 }], tk.bloom, tk.easeOut));
  for (const P of K.plates) ps.push(run(P.sharp, [{ opacity: 0, offset: 0 }], tk.bloom, tk.easeOut));
  return track(Promise.all(ps));
}

// seal: the choice is final. Boxes go from dashed to solid and the rule goes firm at once; the label reads LOCKED and fades in.
// Nothing scales.
function cueSeal(red) {
  const K = visible(); if (!K) return Promise.resolve();
  locked = true;
  K.el.classList.add("k-locked"); K.chrome.classList.add("k-locked");
  applyTracks(K);
  const ps = [];
  if (!red) {
    for (const T of K.tracks) if (!T.conf.hidden) ps.push(run(T.conf, [{ opacity: 0, offset: 0 }], tk.seal, tk.easeOut));
  }
  ps.push(printLine(K, "seal", "INPUT LOCKED"));
  return track(Promise.all(ps));
}

// roll: one scan pass. The dice cells fill left to right. The log prints the roll. The boxes do not move.
function cueRoll(c, red) {
  const K = visible(); if (!K) return Promise.resolve();
  const faces = Array.isArray(c.faces) ? c.faces : [];
  const lab = ((K.logs.find(L => L.layer.modLabel) || { layer: {} }).layer.modLabel) || "MOD";
  const L = logFor(K, "roll");
  const els = L ? addEntry(L, K, [{ cells: faces.map(f => faceChar(c.dice || "", f)) },
    { t: `${lab} ${signed(c.add || 0)} = ${c.total} VS ${c.vs}` }, { t: `TIER: ${String(c.used || c.result || "").toUpperCase()}` }]) : null;
  const ps = [];
  if (!red && !skipNow) {
    const sc = K.scans[0];
    if (sc) ps.push(run(sc.pass, [{ opacity: 0.35, transform: "translateY(0)", offset: 0 }, { opacity: 0.35, transform: "translateY(100%)", offset: 1 }], tk.roll, tk.easeLinear));
    if (els && els.length) {
      // one cover over the three rows slides off to the right in n steps, so each cell changes once, left to right
      const first = els[0], last = els[els.length - 1], cov = document.createElement("i");
      cov.className = "k-cover";
      cov.style.cssText = `left:0;right:0;top:${first.offsetTop}px;height:${last.offsetTop + last.offsetHeight - first.offsetTop}px;transform:translateX(100%)`;
      L.el.appendChild(cov);
      const a = run(cov, [{ transform: "translateX(0)", offset: 0 }], tk.roll, `steps(${Math.max(1, faces.length)}, end)`);
      ps.push(a.then(() => cov.remove(), () => cov.remove()));
    }
  }
  return track(Promise.all(ps), () => { for (const e of host.querySelectorAll(".k-cover")) e.remove(); });
}

// cost and gain: one new line in the log. A change to the exposure meter changes the confidence numbers and the rest scale of
// every bound box, with no motion.
function cueMeter(c, red) {
  const K = visible(); if (!K) return Promise.resolve();
  const def = meterDefs[c.meter] || {};
  const d = ((c.type === "gain") !== !!def.bad ? 1 : -1) * (c.n || 0); // the way the meter's value moved
  const ps = [];
  if (c.meter === "exposure") {
    K.expo = (K.expo || 0) + d;
    applyTracks(K);
    applyBands(K);
  }
  ps.push(printLine(K, c.type, `${meterLabel(c.meter)} ${signed(d)}`));
  return track(Promise.all(ps));
}

// tear: one band of the frame slips sideways and returns; the boxes drop out under it for that moment.
function cueTear(red) {
  const K = visible(); if (!K) return Promise.resolve();
  const ps = [printLine(K, "tear", "PLAYER AUTHORITY: 1 FP SPENT")];
  const art = K.geo && !red && !skipNow ? artNode(K.frame && K.frame.art) : null;
  if (!art) return track(Promise.all(ps));
  const g = K.geo, top = Math.round(g.H * 0.2), h = Math.round(g.H * 0.14);
  const bandEl = div("k-band", `top:${top}px;height:${h}px`);
  const inner = div("", `position:absolute;left:${g.left}px;top:${g.top - top}px;width:${g.cw}px;height:${g.ch}px`);
  const holder = div(focusOn ? "k-art" : "k-soft"); holder.appendChild(art); inner.appendChild(holder);
  bandEl.appendChild(inner); K.el.appendChild(bandEl);
  ps.push(run(inner, [{ transform: "translateX(0)", offset: 0 }, { transform: `translateX(${tk.d3}px)`, offset: 0.35 }, { transform: "translateX(0)", offset: 1 }], tk.tear, tk.easeOut)
    .then(() => bandEl.remove(), () => bandEl.remove()));
  return track(Promise.all(ps), () => bandEl.remove());
}

// close: the frame collapses to a line, and the line is labelled. The line and its caption fade in while the frame collapses,
// all in one Promise.all, so the cue ends with the collapse (--m-close) and a tap on it reaches every animation.
function cueClose(red) {
  const K = cur; if (!K) return Promise.resolve();
  closed = true; closedFresh = true;
  K.el.classList.add("k-stop");
  K.el.style.transform = "scaleY(.002)"; // the end states are the elements' own styles
  endEl.classList.add("k-closed");
  if (red) return Promise.resolve();
  const line = endEl.querySelector(".k-endline"), cap = endEl.querySelector(".k-endcap");
  return track(Promise.all([
    run(K.el, [{ transform: "none", offset: 0 }], tk.close, tk.easeIn),
    run(line, [{ opacity: 0, offset: 0 }, { opacity: 0, offset: 0.55 }], tk.close, tk.easeOut),
    run(cap, [{ opacity: 0, offset: 0 }, { opacity: 0, offset: 0.4 }], tk.close, tk.easeOut),
  ]));
}

window.StageKit.register("feed", kit);
})();

</script>
<script>
/* The Stage: the shell. Contract: stage/SPEC.md section 4; motion: stage/MOTION.md.
   The shell owns the text, the HUD, the sheets, the keys, the sound and film mode.
   A kit (ui/kits/<kit>.js) draws the set behind the text and plays each cue.
   The engine (Stage, from engine/stage.js) holds the rules. This file has no rules in it.

   How a step runs:   engine call -> view -> present()
     1. show the new set to the kit (so it can lay it under the old one)
     2. play the step's cues one at a time; each cue is a shell effect plus kit.cue(); wait for both
     3. sync the HUD and kit.update(state), then show the card or the next panel and start the line
   A tap during the cues skips the rest of them. Under reduced motion no animation is started.
   Text panels slide only on a `turn`; any other new panel crossfades over --m-state (MOTION.md, "beat"). The page carries window.SIM (Stage.simulate, embedded by the build) for Verify.

   Kit notes for wave 2:
     - Call order is show() then cue(): for `turn` and `shift` the kit gets the new set first and animates the swap in cue().
       After the step's last cue the shell calls update(state); it also calls update(state) after back, load, Continue and a Verify replay.
     - A tap during a cue calls the kit's finish(): jump the active cue to its end state and resolve its Promise now.
     - A kit element that should react to a tap must be a <button> or carry data-kit-hit; any other tap on the stage is "go on".
     - The engine sends `ink` and `bloom` only when the look changes (and `ink` on a reveal). The shell plays every cue it is given.
     - Map style: <html data-map="ink|blueline"> and a window "stage:map" event; the shell also calls setMap(style) if the kit has it.
     - A beat's `screen` lines: the shell calls screen(lines) if the kit has it (and screen([]) when no beat shows one),
       and then keeps a screen-reader copy only. Without it the shell draws the lines in the text panel.
     - The state a kit gets (show, update): meters, fields, tallies, flags, look (the look on show), revealed (a secret is open) and
       ended (true when the view is at the final ending node: a kit may draw its closed state after a replay or Continue lands there).
     - Motion: <html data-motion="full|calm">. Calm behaves exactly as prefers-reduced-motion: reduce. A kit that decides for itself
       whether to animate (in show(), update() or tick()) must treat data-motion="calm" like the media query. The `reduced` flag
       the shell passes to mount() and cue() already includes it.
   Hooks for tests: #app[data-phase], #app[data-node], #app[data-busy]; #app[data-ending="<id>"] and .panel.ending[data-ending="<id>"]
   while an ending is on show (and absent otherwise); every control is a labelled button.
   Page parameters: ?seed=N fixes the seed. ?force=fail,success steers the next rolls to those result tiers (the browser test uses it).

  type: num("--m-type", 28), autoBase: num("--m-auto-base", 2600), autoChar: num("--m-auto-char", 42),

    if (typeof s.sound === "boolean") r.settings.sound = s.sound;
    if (typeof s.auto === "boolean") r.settings.auto = s.auto;

// ---------------------------------------------------------------- state
const V = {
  game: null, view: null, kit: null, phase: "title", token: 0, rec: null,
  settings: null, found: new Set(), extraMet: new Set(), seen: new Set(),
  shown: { meters: {}, high: {}, tallies: {} }, setId: null, preview: null,
  slide: null, typing: null, cueBusy: false, ctx: null, waiters: new Set(),
  autoT: null, sheet: null, opener: null, replaying: false, seedPending: 1, seedFixed: false, force: [], forceIgnored: [], starting: false,
  lastFlash: -1e9, sealed: false, rollEl: null, sim: null, simAt: 0, rafId: 0, dragX: 0, dragY: 0, restartT: null,
};
const TIERS = ["fail", "tie", "success", "style"]; // the result tiers ?force= accepts, with a table roll's face ranges ("3-4")
const isTier = x => TIERS.includes(x) || /^\d+(-\d+)?$/.test(x);
const SPEED = { slow: 1.6, normal: 1, fast: 0.6 };
const TYPE_MAX = 4000; // ms: the longest a beat may take to type

// ---------------------------------------------------------------- live region
function announce(parts) {
  const text = (Array.isArray(parts) ? parts : [parts]).filter(Boolean).join(". ");
  if (!text) return;
  const live = $("live");
  live.textContent = live.textContent === text ? text + " " : text;

  return { el: node, say: `${gateSay(g.gate, g.cost)}. ${g.ask}`, focus: ".ask" };
}

function resultWord(r) { return { fail: "Fail", success: "Success", tie: "Tie", style: "Style" }[r] || r; }
// A table roll's result reads as its label, or its range ("3–4").
const resultOf = info => (info.table ? info.label || String(info.used || info.result).replace("-", "–") : resultWord(info.result));
function faceText(dice, f) { return /dF$/i.test(dice) ? (f > 0 ? "+" : f < 0 ? "−" : "0") : String(f); }
function rollLine(info) {
  const dF = /dF$/i.test(info.dice);
  const sum = info.faces.reduce((a, b) => a + b, 0);
  const faces = dF ? info.faces.map(f => faceText(info.dice, f)).join(" ") + ` (${sgn(sum)})` : info.faces.join(" + ");
  const add = info.add ? ` ${info.add < 0 ? "−" : "+"} ${Math.abs(info.add)}` : "";
  const eq = info.faces.length > 1 || add ? ` = ${info.total}` : ""; // one die and no bonus: the face is the total
  return `${info.dice}: ${faces}${add}${eq}${info.table ? "" : info.under ? `, ${info.vs} or under` : ` vs ${info.vs}`}`;
}
// The meter a roll adds, for the spoken line ("plus 3 for Code"). A pick names its option; with no pick (Back, Continue) the scene's rolls
// that match the dice and the target decide, when they agree.
function rollMeter(info, ref, v) {
  const sc = ref ? sceneById[ref.scene] : v && v.scene ? sceneById[v.scene.id] : null;
  if (!sc) return null;
  const adds = new Set();
  for (const g of sc.choices || []) {
    if (ref && g.key !== ref.group) continue;
    for (const o of g.options || []) {
      if (ref && o.key !== ref.opt) continue;
      if (o.roll && (ref || (o.roll.dice === info.dice && o.roll.vs === info.vs))) adds.add(o.roll.add || "");
    }
  }
  return adds.size === 1 && [...adds][0] ? [...adds][0] : null;
}
const spokenNum = n => n < 0 ? "minus " + Math.abs(n) : String(n);
// The roll in words, never in symbols: "plus, minus, blank, minus, plus 3 for Code: total 2 against 2"; a roll under reads "4: total 4, needs 2 or under".
function rollWords(info, meterId) {
  const dF = /dF$/i.test(info.dice);
  const faces = info.faces.map(f => dF ? (f > 0 ? "plus" : f < 0 ? "minus" : "blank") : String(f)).join(", ");
  const add = info.add ? `, ${info.add < 0 ? "minus" : "plus"} ${Math.abs(info.add)}${meterId ? " for " + meterLabel(meterId) : ""}` : "";
  return `${faces}${add}: total ${spokenNum(info.total)}${info.table ? "" : info.under ? `, needs ${info.vs} or under` : ` against ${info.vs}`}`;
}
const rollPlain = (info, meterId) => `${rollWords(info, meterId)}. ${resultOf(info)}`; // (announce() joins parts with ". ")
function rollSlide(info, pending, meterId) {
  const dF = /dF$/i.test(info.dice);
  const dice = info.faces.map(f => `<span class="die ${pending ? "pending" : ""}" aria-hidden="true">${pending ? "?" : esc(faceText(info.dice, f))}</span>`).join("");
  const addHtml = info.add ? `<span class="op" aria-hidden="true">${info.add < 0 ? "−" : "+"} ${Math.abs(info.add)}</span>` : "";
  const text = pending ? "Rolling…" : `${rollLine(info)}: `;
  const html = slideHtml(`<section class="panel roll-panel" data-look="${esc(V.view && V.view.scene ? V.view.scene.look : "")}" aria-label="Roll">
      <div class="tags">${gateTag("exec")}</div>
      <p class="roll-ask">The dice decide${dF ? " (four Fate dice)" : ""}</p>
      <div class="dice" role="img" aria-label="${esc(pending ? "Rolling" : rollWords(info, meterId))}">${dice}${pending ? "" : addHtml}</div>
      <p class="roll-line ${pending ? "pending" : ""}" data-r="${pending ? "" : info.table ? "table" : esc(info.result)}"><span class="rl-t" aria-hidden="true">${esc(text)}</span>${pending ? "" : `<span class="res">${esc(resultOf(info))}</span>`}</p></section>`);
  return el(html);
}

function inputSlide(v) {
  const i = v.input;
  const html = slideHtml(`<section class="panel input-panel" data-look="${esc(v.scene ? v.scene.look : "")}" aria-label="Write">
      <form class="in-form" novalidate>
        <label class="ask" for="inField">${esc(i.prompt)}</label>
        <input class="field" id="inField" type="text" maxlength="${i.max}" autocomplete="off" autocapitalize="sentences" enterkeyhint="done">
        <div class="field-meta"><span>Goes on your card: ${esc(fieldLabel(i.field))}</span><span id="inCount">0 / ${i.max}</span></div>
        <div class="row"><button type="submit" class="btn primary">Write it down</button></div>

}

function endingSlide(v) {
  const e = v.ending;
  const html = slideHtml(`<section class="panel ending" data-look="${esc(e.look || "")}" data-ending="${esc(e.id != null ? e.id : "")}" aria-label="Ending">
      <div class="tags"><span class="tag">Ending</span>${lookTag(e.look)}</div>
      <h2 class="end-title" tabindex="-1">${esc(e.title)}</h2>

      <div class="row">
        <button type="button" class="btn primary" data-act="again">Play again</button>

// ---------------------------------------------------------------- typewriter
function stopTyping() { if (V.typing) { V.typing.finish(true); } }
function startTyping(slide, spec, done) {
  const txt = slide.querySelector(".txt"), panel = slide.querySelector(".panel");
  const paint = (n, caret) => {
    const [d, r] = segHtml(spec.segs, n);
    txt.innerHTML = `<span class="t-done">${d}</span>${caret ? '<span class="caret" aria-hidden="true"></span>' : ""}<span class="t-rest">${r}</span>`;
  };
  const key = spec.ref;
  const instant = isReduced() || V.seen.has(key) || spec.total === 0;
  // 28 ms a character, but no beat takes longer than TYPE_MAX to type: a long beat types faster (SPEC section 4).
  const per = Math.min(M.type, TYPE_MAX / Math.max(1, spec.total));
  V.seen.add(key);
  if (instant) { paint(spec.total, false); slide.classList.add("done"); panel.classList.add("done"); if (done) done(); return; }
  let rf = 0, last = -1, ended = false;
  const t0 = performance.now();
  const finish = silent => {
    if (ended) return; ended = true;
    cancelAnimationFrame(rf);
    paint(spec.total, false); slide.classList.add("done"); panel.classList.add("done");
    V.typing = null;
    if (!silent && done) done();
  };
  const frame = now => {
    const n = Math.min(spec.total, Math.floor((now - t0) / per));
    if (n !== last) { if (Math.floor(n / 4) !== Math.floor(Math.max(last, 0) / 4)) snd.tick(); last = n; paint(n, true); }
    if (n >= spec.total) finish(false); else rf = requestAnimationFrame(frame);
  };
  V.typing = { finish };
  paint(0, true);
  rf = requestAnimationFrame(frame);
}
function finishTyping() { if (V.typing) V.typing.finish(false); }

// ---------------------------------------------------------------- cues
async function playCue(c, ctx) {
  const reduced = isReduced() || ctx.skip;
  const v = ctx.v;
  snd.cue(c);
  let shell = Promise.resolve();
  switch (c.type) {
    case "turn":
      ctx.say.push(`${v.scene ? v.scene.title : ""}${v.scene && v.scene.place ? ", " + v.scene.place : ""}`);
      break;
    case "seal": {
      sealPanel(ctx.pickKey);
      ctx.say.push("Sealed");
      shell = wait(M.state);
      break;
    }
    case "tear":
      showCueTag("★ 1 FP spent");
      ctx.say.push("Fate point spent");
      break;
    case "roll": {
      const info = { dice: c.dice, faces: c.faces, total: c.total, add: c.add, vs: c.vs, under: c.under, table: c.table, label: c.label, result: c.result, used: c.used };
      const mid = rollMeter(info, ctx.pickRef, v);
      const sl = rollSlide(info, !reduced, mid);
      V.rollEl = sl;
      showSlide(sl, 1, false, false); // a roll crossfades in: no time has passed
      shell = wait(M.roll).then(() => {
        const done = rollSlide(info, false, mid);
        sl.innerHTML = done.innerHTML;
      });
      ctx.say.push(rollPlain(info, mid));
      break;
    }
    case "cost":
    case "gain": {
      const cur = V.shown.meters[c.meter], d = cueDelta(c);
      if (cur != null) setMeter(c.meter, cur + d, true);
      showDelta(c.meter, d, c.type); // the sign is the number's; cost or gain is the colour and the direction of the label
      // Words, with the direction: a cost on a stress meter makes it rise ("Nerves rises by 1").
      ctx.say.push(`${c.type === "cost" ? "Cost" : "Gain"}: ${meterLabel(c.meter)} ${d < 0 ? "falls" : "rises"} by ${Math.abs(d)}`);
      shell = wait(c.type === "cost" ? M.flash : M.state);
      break;
    }
    case "tally": {
      const t = V.shown.tallies[c.id] || (V.shown.tallies[c.id] = {});
      const final = v.tallies && v.tallies[c.id] ? v.tallies[c.id][c.value] : null;
      t[c.value] = (t[c.value] || 0) + 1;
      if (final != null && t[c.value] > final) t[c.value] = final;
      renderTallies();
      flashTally(c.id, c.value);
      ctx.say.push(`${c.id.charAt(0).toUpperCase() + c.id.slice(1)}, ${c.value}`);
      shell = wait(M.state);
      break;
    }
    case "close":
      ctx.say.push(v.ending ? v.ending.title : "The end");
      break;
  }
  await Promise.all([kitCue(c, ctx), shell]);
}

function sealPanel(key) {
  V.sealed = true;
  const sl = V.slide;
  if (!sl) return;
  for (const b of sl.querySelectorAll(".opt")) {
    if (b.dataset.key === key) { b.classList.add("sealed"); b.setAttribute("aria-pressed", "true"); }
    else { b.classList.add("spent"); b.setAttribute("aria-disabled", "true"); }
  }
  const n = sl.querySelector(".sealed-note"); if (n) n.hidden = false;
  deckUI();
}

function skipCues() {
  if (!V.cueBusy) return;
  if (V.ctx) V.ctx.skip = true;
  kitCall("finish");
  for (const f of [...V.waiters]) f();
}

// ---------------------------------------------------------------- present: one step of the story
async function present(v, o) {
  const tk = ++V.token;
  o = o || {};
  const cues = v.cues || [];
  const turn = cues.find(c => c.type === "turn");
  const hasShift = cues.some(c => c.type === "shift");
  const dir = turn ? (turn.dir || 1) : (o.dir || 1);
  const ctx = { skip: false, scene: v.scene, beat: v.beat, v, setChange: !!turn || hasShift, pickKey: o.pickKey, pickRef: o.pickRef || null, say: [] };
  V.ctx = ctx; V.cueBusy = true; V.rollEl = null; V.sealed = false;
  root.setAttribute("data-cue", "");
  setBusy();
  stopTyping(); clearAuto();

  const setId = v.scene && v.scene.set;
  if (setId && (o.fresh || o.instant || ctx.setChange || V.setId !== setId)) { kitShow(setId, v, !ctx.setChange || !!o.instant); V.setId = setId; }
  if (turn) dropSlide(dir);

  for (const c of cues) {
    if (tk !== V.token) return;
    await playCue(c, ctx); // the engine sends ink and bloom only when the look changes: play what it sends
  }
  if (tk !== V.token) return;

  V.cueBusy = false; V.ctx = null;
  root.removeAttribute("data-cue");
  syncHud(v);
  kitUpdate(v);
  record(v);
  setPlace(v);
  setNode(v);

  const card = !!v.scene && ((turn && dir > 0) || o.fresh) && !o.noCard;
  if (card) {
    V.phase = "card"; $("app").dataset.phase = "card";
    kitCall("screen", []);
    showSlide(cardSlide(v.scene), dir, false, true); // the card arrives with the turn
    announce(ctx.say.filter(Boolean));
    deckUI(); armAuto();
  } else {
    V.phase = "play"; $("app").dataset.phase = "play";
    renderNode(v, dir, ctx.say, Object.assign({}, o, { slide: !!turn || !!o.fresh })); // only a turn (or the first scene) slides the text
  }

}

function renderNode(v, dir, say, o) {
  say = (say || []).filter(Boolean);
  o = o || {};
  setNode(v);
  let built = null, slide;
  if (v.node === "roll") {
    if (V.rollEl && V.rollEl.isConnected && V.slide === V.rollEl) { slide = V.rollEl; V.rollEl = null; }
    else if (v.roll) { const mid = rollMeter(v.roll, null, v); slide = rollSlide(v.roll, false, mid); say.push(rollPlain(v.roll, mid)); showSlide(slide, dir, o.instant, o.slide); }
    else return;
  } else {
    built = v.node === "beat" ? beatSlide(v) : v.node === "choice" ? choiceSlide(v) : v.node === "input" ? inputSlide(v)
      : v.node === "ending" ? endingSlide(v) : null;
    if (!built) return;
    slide = built.el;
    showSlide(slide, dir, o.instant, o.slide);
    if (built.say) say.push(built.say);
  }
  kitCall("screen", v.node === "beat" && v.beat && !v.beat.hidden && v.beat.screen ? v.beat.screen : []);
  announce(say);
  if (built && built.typing) startTyping(slide, built.typing, () => { deckUI(); armAuto(); });
  else if (v.node === "beat" || v.node === "roll") { slide.classList.add("done"); }
  if (built && built.focus) { const f = slide.querySelector(built.focus); if (f) f.focus({ preventScroll: true }); }
  if (v.node === "ending") { slide.classList.add("done"); }
  if (v.node === "choice") slide.classList.add("done");

// #app[data-node] and #app[data-ending] follow the view. The ending id is there for tests and kits; it is absent at any other node.
function setNode(v) {
  const app = $("app");
  app.dataset.node = v.node || "";
  if (v.node === "ending" && v.ending && v.ending.id != null) app.dataset.ending = v.ending.id; else delete app.dataset.ending;
}
function setPlace(v) {
  $("place").textContent = v.scene && v.scene.place ? v.scene.place : "";

}
function setBusy() { $("app").dataset.busy = (V.cueBusy || V.typing) ? "1" : "0"; }

// ---------------------------------------------------------------- deck
function deckUI() {
  const v = V.view, back = $("backBtn"), next = $("nextBtn"), hint = $("hint");
  setBusy();
  if (V.phase === "title" || !v) {
    // At the title Next acts as the main button (Begin, or Continue when there is a save), on every device.
    const cont = canContinue();
    back.disabled = true; next.disabled = false;
    next.innerHTML = `${cont ? "Continue" : "Begin"} <span aria-hidden="true">&rarr;</span>`;
    hint.textContent = isTouch() ? `Tap ${cont ? "Continue" : "Begin"}.` : cont ? "Press Enter to continue." : "Press Enter to begin.";
    return;
  }
  back.disabled = !v.canBack || V.sealed;
  let nextLabel = 'Next <span aria-hidden="true">&rarr;</span>', h = "", off = false;
  if (V.cueBusy) h = "Tap to skip the motion.";

  else if (V.phase === "card") h = "Tap or press → to open the scene.";
  else if (v.node === "beat") {
    if (v.beat && v.beat.hidden) { nextLabel = 'Reveal <span aria-hidden="true">&rarr;</span>'; h = keysOn() ? "Press R to reveal the note." : "Tap Reveal."; }
    else h = "Tap or press → to go on.";
  } else if (v.node === "choice") {
    off = true;
    h = V.sealed ? "Sealed. No going back." : `${gateWord(v.group.gate, v.group.cost)}. ${keysOn() ? "Press " + (v.options.length > 2 ? "1 to " + v.options.length : v.options.length === 2 ? "1 or 2" : "1") : "Tap an option"}.`;
    if (v.group.gate === "plan" && !V.sealed) h += " You can go back.";
  } else if (v.node === "input") { off = true; h = "Type, then press Enter."; }

  else if (v.node === "ending") { off = true; h = `Endings found ${V.found.size} of ${ENDING_IDS.length}.`; }
  next.innerHTML = nextLabel;
  next.disabled = off && !V.cueBusy && !V.typing;

}
// The seed line. A touch screen has no room for it under the deck: it moves into the Settings sheet.
function footPlay(v) {
  const seed = v && v.seed != null ? v.seed : V.seedPending;
  return `Seed ${seed}${V.replaying ? " · replay" : ""} · ${runUrl(seed)} repeats this run${ignoredNote()}`;
}
const footTitle = () => `Seed ${V.seedPending}${V.force.length ? " (set by ?seed or ?force)" : V.seedFixed ? " (set by ?seed)" : ""}${ignoredNote()}`;
function setFoot(text) {
  V.footText = text;
  const f = $("foot"), t = isTouch();
  f.textContent = t ? "" : text;
  f.hidden = t;

}
// The query that repeats this run: the seed, and the forced tiers when ?force= was given.
const runUrl = seed => `?seed=${seed}${V.force.length ? "&force=" + V.force.join(",") : ""}`;
const ignoredNote = () => V.forceIgnored.length ? ` · ignored in ?force: ${V.forceIgnored.join(", ")}` : "";

// ---------------------------------------------------------------- film mode
function clearAuto() {
  clearTimeout(V.autoT); V.autoT = null;
  const f = $("autoFill"); f.getAnimations().forEach(a => a.cancel());
}
function armAuto() {
  clearAuto();
  if (!V.settings.auto || !V.view || V.sheet || document.hidden || V.cueBusy || V.typing) return;
  const v = V.view;
  let len = 0;
  if (V.phase === "card") len = (v.scene ? (v.scene.title + v.scene.place).length : 0);
  else if (V.phase === "play" && v.node === "beat" && v.beat && !v.beat.hidden) len = v.beat.text.length;
  else return; // AUTO stops at every choice, roll, input, reveal and ending
  const ms = Math.min(14000, M.autoBase + len * M.autoChar) * SPEED[V.settings.speed];
  if (!isReduced()) $("autoFill").animate([{ transform: "scaleX(0)" }, { transform: "scaleX(1)" }], { duration: ms, easing: M.easeLinear });
  V.autoT = setTimeout(() => { V.autoT = null; advance(); }, ms);
}
function syncAutoBtn() {
  const b = $("autoBtn"), on = !!V.settings.auto;
  // One fixed name; aria-pressed says whether film mode is on (WCAG 2.5.3: the name holds the visible word).
  b.setAttribute("aria-pressed", String(on));
  b.textContent = "AUTO";
  b.setAttribute("aria-label", "Film mode (AUTO)");
}
function setAuto(on) {
  V.settings.auto = !!on;
  syncAutoBtn();
  announce(on ? "AUTO on" : "AUTO off");
  persistSettings();
  if (on) armAuto(); else clearAuto();
  deckUI();
  if (V.sheet === "settings") renderSettings();
}

// ---------------------------------------------------------------- input from the player
function advance() {
  if (V.sheet) return;
  if (V.phase === "title") { const b = $("slides").querySelector("#contBtn, #beginBtn"); if (b) b.click(); return; }
  if (V.cueBusy) return skipCues();
  if (V.typing) return finishTyping();
  if (V.phase === "card") return dismissCard();
  const v = V.view;
  if (v.node === "beat") return v.beat.hidden ? reveal() : step(() => V.game.next(), { dir: 1 });
  if (v.node === "roll") return step(() => V.game.next(), { dir: 1 });
}
function dismissCard() {
  V.phase = "play"; $("app").dataset.phase = "play";
  renderNode(V.view, 1, [], {});
}
function reveal() {
  if (V.phase !== "play" || !V.view || V.view.node !== "beat" || !V.view.beat.hidden || V.cueBusy) return;
  step(() => V.game.reveal(), { dir: 1, reveal: true });
}
function pick(key) {
  const v = V.view;
  if (V.phase !== "play" || !v || v.node !== "choice" || V.cueBusy || V.sealed) return;
  const o = v.options.find(x => x.key === key);
  if (!o) return;
  if (o.locked) { announce(`Locked. ${o.hint || ""}`); return; }
  step(() => V.game.choose(key), { dir: 1, pickKey: key, pickRef: { scene: v.scene ? v.scene.id : "", group: v.group ? v.group.key : "", opt: key } });
}
function goBack() {
  if (V.phase === "title" || !V.view) return;
  if (V.cueBusy) return skipCues();
  if (V.typing) finishTyping();
  if (!V.view.canBack || V.sealed) { announce(V.sealed ? "Sealed. No going back." : "You cannot go back from here."); return; }
  step(() => V.game.back(), { dir: -1 });
}
async function step(fn, o) {
  if (!V.game) return;
  if (V.cueBusy) return skipCues();
  stopTyping(); clearAuto();
  const v = fn();
  if (v.refused) { announce(v.refused); return; }
  V.view = v;
  await present(v, o);
}
function submitInput(text) {
  if (V.phase !== "play" || !V.view || V.view.node !== "input") return;
  step(() => V.game.input(text), { dir: 1 });
}

// ---------------------------------------------------------------- game start, save and restore
function canContinue() {
  if (V.seedFixed) return false;
  const s = V.rec && V.rec.save;
  if (!s) return false;
  try { const d = JSON.parse(s); return d && d.pack === PACK.id && Array.isArray(d.hist) && d.hist.length > 1; } catch (e) { return false; }
}
// A Verify replay and a ?force= run are not the reader's own play: neither writes the save, the found endings or the notes met.
const volatileRun = () => V.replaying || V.force.length > 0;
function persist(v) {
  if (volatileRun()) return;
  V.rec.found = [...V.found];
  V.rec.met = [...V.extraMet];
  V.rec.settings = V.settings;
  V.rec.save = v && v.node === "ending" ? null : V.game.save();
  store.write(V.rec);
}
function persistSettings() {
  if (!V.rec) return;
  V.rec.settings = V.settings;
  if (!volatileRun()) { V.rec.found = [...V.found]; V.rec.met = [...V.extraMet]; }
  store.write(V.rec);
}
function record(v) {
  for (const id of v.found || []) V.found.add(id);
  if (v.node === "ending" && v.ending && v.ending.id != null) V.found.add(v.ending.id);
  persist(v);
}
function newSeed() { return Math.floor(Math.random() * 0x7fffffff) + 1; }

function begin(cont) {
  // Enter or Space during the opening cues (the title's button keeps focus) must not start the story again.
  // The flag is set here and cleared when the first beat or card has rendered, when the start fails, or at the title.
  if (V.starting) return;
  V.starting = true;
  cancelPreview();
  if (V.sheet) closeSheet(true);
  V.token++; stopTyping(); clearAuto();
  V.replaying = false;
  const seed = V.seedPending;
  let save = null;
  if (cont && canContinue()) save = V.rec.save;
  try { V.game = Stage.create(PACK, { seed, save, force: V.force.slice() }); } catch (e) { V.starting = false; console.error(e); announce("This story could not start."); return; }

  V.seedPending = V.view.seed;

  $("app").dataset.phase = "play";
  if (save) restore(V.view);
  else {
    V.phase = "play";

// Run fn in the task after the next frame has painted (a frame callback runs before the paint, a timer after it).
